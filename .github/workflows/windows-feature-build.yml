name: Windows feature build

on:
  push:
    branches:
      - feat/preconnect-proxy-tests
    paths:
      - '.github/workflows/windows-feature-build.yml'
      - 'lib/**'
      - 'windows/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'Makefile'
  workflow_dispatch:

concurrency:
  group: windows-feature-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-flutter
        with:
          platform: common
          install-deps: false
      - name: Pack generated Dart code
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --others -- lib test > "$RUNNER_TEMP/generated-files.txt"
          test -s "$RUNNER_TEMP/generated-files.txt"
          tar -czf generated-code.tar.gz -T "$RUNNER_TEMP/generated-files.txt"
      - uses: actions/upload-artifact@v6
        with:
          name: generated-code
          path: generated-code.tar.gz
          retention-days: 1

  windows:
    needs: codegen
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CHANNEL: dev
      IS_GITHUB_ACTIONS: 1
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-flutter
        with:
          platform: windows
          generated-code: true
      - name: Build and validate Windows Release
        shell: pwsh
        run: make windows-validate
      - name: Package Windows Setup.exe
        shell: pwsh
        run: make windows-exe-release
      - name: Smoke install and launch Windows Setup.exe
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter '*setup.exe' -Recurse | Select-Object -First 1
          if ($null -eq $installer) { throw 'Windows Setup.exe was not produced.' }

          $installDir = Join-Path $env:RUNNER_TEMP 'hiddify-setup-smoke'
          $setupArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=`"$installDir`"")
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList $setupArgs -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Setup.exe failed with exit code $($setup.ExitCode)." }

          $appPath = Join-Path $installDir 'Hiddify.exe'
          foreach ($required in @('Hiddify.exe', 'HiddifyCore.exe', 'HiddifyCoreEngine.exe')) {
            if (-not (Test-Path (Join-Path $installDir $required))) {
              throw "Installed app is missing $required."
            }
          }

          $process = Start-Process -FilePath $appPath -WorkingDirectory $installDir -PassThru
          try {
            Start-Sleep -Seconds 10
            $process.Refresh()
            if ($process.HasExited) {
              throw "Installed Hiddify exited during startup (exit code $($process.ExitCode))."
            }
          }
          finally {
            if (-not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F | Out-Null
            }
          }

          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Windows uninstaller was not installed.' }
          $remove = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -PassThru -Wait
          if ($remove.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($remove.ExitCode)." }
      - name: Package Windows portable ZIP
        shell: pwsh
        run: make windows-zip-release
      - name: Smoke launch Windows portable app
        shell: pwsh
        run: |
          $archive = Get-ChildItem -Path dist -Filter '*windows.zip' -Recurse | Select-Object -First 1
          if ($null -eq $archive) { throw 'Portable Windows archive was not produced.' }

          $smokeDir = Join-Path $env:RUNNER_TEMP 'hiddify-windows-smoke'
          Expand-Archive -Path $archive.FullName -DestinationPath $smokeDir -Force

          $appDir = Join-Path $smokeDir 'Hiddify'
          $appPath = Join-Path $appDir 'Hiddify.exe'
          foreach ($required in @('Hiddify.exe', 'HiddifyCore.exe', 'HiddifyCoreEngine.exe')) {
            if (-not (Test-Path (Join-Path $appDir $required))) {
              throw "Portable package is missing $required."
            }
          }

          $process = Start-Process -FilePath $appPath -WorkingDirectory $appDir -PassThru
          try {
            Start-Sleep -Seconds 10
            $process.Refresh()
            if ($process.HasExited) {
              throw "Hiddify exited during startup (exit code $($process.ExitCode))."
            }
          }
          finally {
            if (-not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F | Out-Null
            }
          }
      - name: Upload Windows installers
        uses: actions/upload-artifact@v6
        with:
          name: hiddify-windows-feature-build
          path: |
            dist/**/*.exe
            dist/**/*.zip
          if-no-files-found: error
          retention-days: 7
