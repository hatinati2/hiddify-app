name: Android HyBeta4 Real Delay APK

on:
  push:
    branches:
      - hybeta4/real-delay-v2raywatch-20261117
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-beta:
    name: Build HyBeta4 Real Delay APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CHANNEL: prod
      IS_GITHUB_ACTIONS: 1
      FLUTTER_VERSION: "3.38.5"
      NDK_VERSION: r28c
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout pinned Hiddify Core
        uses: actions/checkout@v6
        with:
          repository: hiddify/hiddify-core
          ref: v5.9.8
          path: hiddify-core
          submodules: false

      - name: Initialize pinned Core submodules
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf git@github.com:
          git config --global --add url."https://github.com/".insteadOf ssh://git@github.com/
          git -C hiddify-core submodule sync --recursive
          git -C hiddify-core submodule update --init --recursive
          test "$(git -C hiddify-core/hiddify-sing-box rev-parse HEAD)" = "9dbf55dde90870dc2692ed5372e30ec7c7bbcfd6"

      - name: Setup Go for pinned Core
        uses: actions/setup-go@v5
        with:
          go-version-file: hiddify-core/go.mod
          cache: true
          cache-dependency-path: |
            hiddify-core/go.sum
            hiddify-core/hiddify-sing-box/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: "3.38.5"
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c

      - name: Install build tools
        run: |
          set -euo pipefail
          make android-apk-install-deps
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Configure release signing when available
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -n "$ANDROID_SIGNING_KEY" ]]; then
            mkdir -p android
            printf '%s' "$ANDROID_SIGNING_KEY" | base64 --decode > android/key.jks
            {
              printf 'storeFile=%s/android/key.jks\n' "$GITHUB_WORKSPACE"
              printf 'storePassword=%s\n' "$ANDROID_SIGNING_STORE_PASSWORD"
              printf 'keyPassword=%s\n' "$ANDROID_SIGNING_KEY_PASSWORD"
              printf 'keyAlias=%s\n' "$ANDROID_SIGNING_KEY_ALIAS"
            } > android/key.properties
            echo "Release signing key configured."
          else
            echo "::warning::ANDROID_SIGNING_KEY is not configured. HyBeta4.apk will use the Android debug signing key; uninstall the store-signed Hiddify first if Android rejects an in-place update."
          fi

      - name: Prepare Flutter production dependencies
        run: make common-prepare

      - name: Apply V2rayWatch Real Delay and build Core
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-v2raywatch-real-delay.py
          gofmt -w hiddify-core/hiddify-sing-box/common/urltest/urltest.go hiddify-core/hiddify-sing-box/common/urltest/h_urltest_test.go
          (
            cd hiddify-core/hiddify-sing-box
            go test ./common/urltest
          )
          make -C hiddify-core android
          mkdir -p android/app/libs
          cp hiddify-core/bin/hiddify-core.aar android/app/libs/hiddify-core.aar

      - name: Build APKs
        run: make android-apk-release

      - name: Collect HyBeta4 APK
        shell: bash
        run: |
          set -euo pipefail
          source_dir="build/app/outputs/flutter-apk"
          test -f "$source_dir/app-release.apk"
          mkdir -p beta-output
          cp "$source_dir/app-release.apk" beta-output/HyBeta4-universal.apk
          cp "$source_dir"/*arm64-v8a*.apk beta-output/HyBeta4-arm64.apk 2>/dev/null || true
          cp "$source_dir"/*armeabi-v7a*.apk beta-output/HyBeta4-armv7.apk 2>/dev/null || true
          cp "$source_dir"/*x86_64*.apk beta-output/HyBeta4-x86_64.apk 2>/dev/null || true
          ls -lh beta-output

      - name: Upload Beta APK
        uses: actions/upload-artifact@v6
        with:
          name: HyBeta4
          path: beta-output/*.apk
          if-no-files-found: error
          retention-days: 30
